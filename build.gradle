plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.78'
}

version = '1.0.0'
group = 'com.torchcampfiredamage'

base {
    archivesName = 'torchcampfiredamage'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
    // Curios API（饰品栏）
    maven {
        name = 'IllusiveC4'
        url = 'https://maven.theillusivec4.top/'
    }
}

neoForge {
    version = '21.1.72'

    runs {
        client {
            client()
        }
        server {
            server()
        }
    }

    mods {
        torchcampfiredamage {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    // Dear ImGui Java binding and LWJGL3 OpenGL renderer.
    implementation "io.github.spair:imgui-java-binding:1.88.0"
    implementation("io.github.spair:imgui-java-lwjgl3:1.88.0") {
        exclude group: 'org.lwjgl'
    }
    runtimeOnly "io.github.spair:imgui-java-natives-windows:1.88.0"
    runtimeOnly "io.github.spair:imgui-java-natives-linux:1.88.0"
    runtimeOnly "io.github.spair:imgui-java-natives-macos:1.88.0"
    // Curios API —— 饰品栏支持（1.21.1 NeoForge）
    compileOnly "top.theillusivec4.curios:curios-neoforge:9.5.1+1.21.1:api"
    runtimeOnly "top.theillusivec4.curios:curios-neoforge:9.5.1+1.21.1"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}