name: Build Forge 1.20.1

on:
  push:
    branches: [ main ]
    paths:
      - 'forge-1.20.1/**'
      - '.github/workflows/build-forge.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'forge-1.20.1/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: forge-1.20.1

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
          cache-read-only: false

      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon --stacktrace

      - name: Upload Artifact
        uses: actions/upload-artifact@v5
        if: success()
        with:
          name: torchcampfiredamage-forge-1.20.1
          path: forge-1.20.1/build/libs/*.jar
          retention-days: 30