name: Build Mod

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    # 固定 24.04，避免 ubuntu-latest 未来漂移到 Ubuntu 26
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # 缓存服务不稳定时不让整个构建失败
          cache-read-only: false

      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon --warning-mode all

      - name: Upload Artifact
        uses: actions/upload-artifact@v5
        with:
          name: torchcampfiredamage-jar
          path: build/libs/*.jar
          retention-days: 30